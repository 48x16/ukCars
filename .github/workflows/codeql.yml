# Static security analysis of our JavaScript. Free for public repositories.
# Findings appear under Security > Code scanning, and on pull requests as annotations.
# Azure DevOps equivalent: GitHub Advanced Security for Azure DevOps (CodeQL task).

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1' # weekly, to catch newly published vulnerability patterns

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # to upload results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          queries: security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
