# The quality gate. Runs on every pull request and every push to main.
# With branch protection set to require the "checks" job, nothing merges unless it passes.
# Azure DevOps equivalent: a build validation pipeline attached to a branch policy.
#
# Uses tiny fixture data, so a pull request never depends on DfT's website being up.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependency audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build with fixture data
        run: |
          npm run data:fixture
          npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (WCAG 2.2 AA)
        run: npm run test:e2e

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
